  <text x="30" y="566" font-family="sans-serif" font-size="12" fill="#57606a">※「必須」のうち、無いと BASIC が起動しないのは fbasic30.rom と subsys_c.rom の 2 つです（全機種共通）。</text>
  <text x="30" y="584" font-family="sans-serif" font-size="12" fill="#57606a">　他の「必須」はヘッドレスでは無くても BASIC 起動まで進みますが、表示・漢字・機種固有機能に必要です。</text>
  <text x="30" y="602" font-family="sans-serif" font-size="12" fill="#57606a">　サイズや読み込みメソッド名は本文の表を参照してください。ファイル名は一例です。</text>
