<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410">
  <title>ディスク挿入と FDC の図。loadDisk による挿入と selectDisk による切り替え</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="410" fill="#ffffff"/>
  <text x="420" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">ディスク挿入と FDC</text>

  <!-- ディスクファイル -->
  <rect x="40" y="100" width="170" height="56" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="125" y="124" font-family="monospace" font-size="14" font-weight="bold" fill="#bc4c00" text-anchor="middle">disk.d77</text>
  <text x="125" y="144" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">ArrayBuffer で渡す</text>

  <line x1="210" y1="128" x2="326" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="267" y="115" font-family="monospace" font-size="11" fill="#0969da" text-anchor="middle">loadDisk(0, buf)</text>

  <!-- FDC 容器 -->
  <rect x="330" y="60" width="470" height="220" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="565" y="86" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da" text-anchor="middle">fm7.fdc（フロッピーディスクコントローラ）</text>

  <rect x="355" y="104" width="190" height="56" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="450" y="128" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">形式を自動判別</text>
  <text x="450" y="148" font-family="sans-serif" font-size="13" fill="#0969da" text-anchor="middle">D77 / 2D / HFE</text>

  <line x1="545" y1="132" x2="606" y2="124" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ahg)"/>

  <!-- ドライブ -->
  <rect x="610" y="104" width="170" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="695" y="126" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">ドライブ 0 ← 挿入</text>
  <rect x="610" y="146" width="170" height="34" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <text x="695" y="168" font-family="sans-serif" font-size="13" fill="#57606a" text-anchor="middle">ドライブ 1</text>
  <rect x="610" y="188" width="170" height="34" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <text x="695" y="210" font-family="sans-serif" font-size="13" fill="#57606a" text-anchor="middle">ドライブ 2</text>
  <rect x="610" y="230" width="170" height="34" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <text x="695" y="252" font-family="sans-serif" font-size="13" fill="#57606a" text-anchor="middle">ドライブ 3</text>

  <text x="355" y="190" font-family="sans-serif" font-size="12" fill="#57606a">driveNum は 0〜3。</text>
  <text x="355" y="208" font-family="sans-serif" font-size="12" fill="#57606a">ディスクなしで reset() すると</text>
  <text x="355" y="226" font-family="sans-serif" font-size="12" fill="#57606a">ROM BASIC が起動します。</text>

  <!-- 連結ディスク -->
  <rect x="40" y="310" width="470" height="76" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="60" y="336" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8250df">連結ディスク（1 ファイルに複数枚を収録した D77）</text>
  <rect x="60" y="348" width="80" height="26" rx="6" fill="#ffffff" stroke="#8250df"/>
  <text x="100" y="366" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">diskIdx 0</text>
  <rect x="150" y="348" width="80" height="26" rx="6" fill="#ffffff" stroke="#8250df"/>
  <text x="190" y="366" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">diskIdx 1</text>
  <rect x="240" y="348" width="80" height="26" rx="6" fill="#ffffff" stroke="#8250df"/>
  <text x="280" y="366" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">diskIdx 2</text>
  <text x="345" y="366" font-family="sans-serif" font-size="13" fill="#57606a">… から 1 枚を選ぶ</text>

  <line x1="510" y1="348" x2="640" y2="272" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="610" y="330" font-family="monospace" font-size="12" fill="#8250df" text-anchor="middle">selectDisk(driveNum, diskIdx)</text>
  <text x="610" y="348" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">で挿入中のディスクを切り替え</text>
</svg>
