<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <title>画面キャプチャの流れ図。render から PPM ファイル出力まで</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <text x="400" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">画面キャプチャの流れ（PPM 出力）</text>

  <rect x="140" y="50" width="520" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="73" font-family="monospace" font-size="14" font-weight="bold" fill="#0969da" text-anchor="middle">fm7.display.render(canvas, true)</text>
  <text x="400" y="94" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">コアに「この canvas へ描いて」と頼む（第2引数 true = 強制再描画）</text>
  <line x1="400" y1="106" x2="400" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="140" y="132" width="520" height="56" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">Canvas シム（getContext('2d') の代役）</text>
  <text x="400" y="176" font-family="monospace" font-size="12" fill="#57606a" text-anchor="middle">createImageData(w, h) でコアがピクセルバッファを確保</text>
  <line x1="400" y1="188" x2="400" y2="210" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="140" y="214" width="520" height="56" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="400" y="237" font-family="monospace" font-size="14" font-weight="bold" fill="#bc4c00" text-anchor="middle">putImageData(imageData)</text>
  <text x="400" y="258" font-family="sans-serif" font-size="12" fill="#bc4c00" text-anchor="middle">コアが完成画像を渡してくる ← シム側でここで保持する</text>
  <line x1="400" y1="270" x2="400" y2="292" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="140" y="296" width="520" height="56" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="319" font-family="monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">imageData.data</text>
  <text x="400" y="340" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">RGBA 各 8 ビットの配列（4 バイトで 1 ピクセル）。幅・高さも imageData から取る</text>
  <line x1="400" y1="352" x2="400" y2="374" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="140" y="378" width="520" height="56" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="401" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">R, G, B だけを取り出して並べ直す</text>
  <text x="400" y="422" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">A（透明度）は捨てて、1 ピクセル 3 バイトにする</text>
  <line x1="400" y1="434" x2="400" y2="456" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="140" y="460" width="520" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="400" y="483" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a7f37" text-anchor="middle">PPM (P6) ファイルとして書き出し</text>
  <text x="400" y="504" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">画像ビューアでそのまま開ける。PNG への変換も簡単（magick frame.ppm frame.png）</text>

  <text x="400" y="546" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">毎回新しいシムを渡すと全面描画されるため確実です（第8章のサンプル参照）</text>
</svg>
