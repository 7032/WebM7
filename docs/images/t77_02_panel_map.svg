<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460">
  <title>Tape Image パネルの見取り図。ファイル選択・Eject・CMT LED・REW・カウンタ・録音保存ボタンの位置</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="460" fill="#ffffff"/>
  <text x="420" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">Tape Image パネル 見取り図</text>

  <!-- panel frame -->
  <rect x="30" y="60" width="400" height="360" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="46" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2328">Tape Image</text>
  <circle cx="146" cy="85" r="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="146" y="89" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="middle">?</text>
  <text x="46" y="112" font-family="sans-serif" font-size="11" fill="#57606a">変更はブラウザ内に保持されます。録音内容を</text>
  <text x="46" y="128" font-family="sans-serif" font-size="11" fill="#57606a">PC へ保存するには 録音を保存 を押してください。</text>

  <!-- file row -->
  <rect x="46" y="142" width="240" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="58" y="162" font-family="sans-serif" font-size="12" fill="#1f2328">ファイル選択（.t77 / .wav）</text>
  <rect x="296" y="142" width="100" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="346" y="162" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">Eject</text>

  <!-- filename row -->
  <rect x="46" y="182" width="350" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="199" font-family="monospace" font-size="12" fill="#1f2328">tape_demo.t77</text>

  <!-- cmt row -->
  <circle cx="58" cy="233" r="6" fill="#d0d7de" stroke="#8c959f"/>
  <text x="72" y="237" font-family="sans-serif" font-size="11" fill="#57606a">CMT</text>
  <rect x="110" y="218" width="80" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="150" y="238" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">REW</text>
  <text x="204" y="237" font-family="monospace" font-size="11" fill="#57606a">pos=0 (loaded)</text>

  <!-- rec label + row -->
  <text x="46" y="282" font-family="sans-serif" font-size="11" fill="#57606a">録音（BASIC の SAVE / SAVEM で書き込んだ内容）</text>
  <rect x="46" y="294" width="104" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="98" y="314" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">録音→.t77</text>
  <rect x="158" y="294" width="104" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="210" y="314" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">録音→.wav</text>
  <rect x="270" y="294" width="96" height="30" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="318" y="314" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">録音クリア</text>
  <text x="46" y="352" font-family="monospace" font-size="11" fill="#57606a">rec 0</text>

  <!-- number badges on panel -->
  <circle cx="290" cy="142" r="10" fill="#0969da"/>
  <text x="290" y="146" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="400" cy="142" r="10" fill="#0969da"/>
  <text x="400" y="146" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="404" cy="194" r="10" fill="#0969da"/>
  <text x="404" y="198" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="58" cy="212" r="10" fill="#1a7f37"/>
  <text x="58" y="216" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="194" cy="218" r="10" fill="#1a7f37"/>
  <text x="194" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="310" cy="233" r="10" fill="#1a7f37"/>
  <text x="310" y="237" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <circle cx="380" cy="294" r="10" fill="#bc4c00"/>
  <text x="380" y="298" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <circle cx="92" cy="348" r="10" fill="#bc4c00"/>
  <text x="92" y="352" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

  <!-- legend -->
  <text x="470" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2328">各部の説明</text>
  <circle cx="482" cy="108" r="10" fill="#0969da"/>
  <text x="482" y="112" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="502" y="113" font-family="sans-serif" font-size="13" fill="#1f2328">ファイル選択 — .t77 / .wav をセット</text>
  <circle cx="482" cy="146" r="10" fill="#0969da"/>
  <text x="482" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="502" y="151" font-family="sans-serif" font-size="13" fill="#1f2328">Eject — テープを取り出す</text>
  <circle cx="482" cy="184" r="10" fill="#0969da"/>
  <text x="482" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="502" y="189" font-family="sans-serif" font-size="13" fill="#1f2328">セット中のファイル名を表示</text>
  <circle cx="482" cy="222" r="10" fill="#1a7f37"/>
  <text x="482" y="226" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="502" y="227" font-family="sans-serif" font-size="13" fill="#1f2328">CMT LED — モーター ON で点灯</text>
  <circle cx="482" cy="260" r="10" fill="#1a7f37"/>
  <text x="482" y="264" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="502" y="265" font-family="sans-serif" font-size="13" fill="#1f2328">REW — 巻き戻し（位置を 0 へ）</text>
  <circle cx="482" cy="298" r="10" fill="#1a7f37"/>
  <text x="482" y="302" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="502" y="303" font-family="sans-serif" font-size="13" fill="#1f2328">カウンタ — 位置・進行率・EOT を表示</text>
  <circle cx="482" cy="336" r="10" fill="#bc4c00"/>
  <text x="482" y="340" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="502" y="341" font-family="sans-serif" font-size="13" fill="#1f2328">録音保存 — 録音が空のときは淡色表示</text>
  <circle cx="482" cy="374" r="10" fill="#bc4c00"/>
  <text x="482" y="378" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="502" y="379" font-family="sans-serif" font-size="13" fill="#1f2328">rec — 録音済みパルス数（0 なら空）</text>
</svg>
