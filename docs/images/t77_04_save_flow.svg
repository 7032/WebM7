<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>T77 保存の全体の流れ。BASIC の SAVE から録音、録音→.t77 ボタンでのダウンロードまでの 4 ステップ</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">T77 保存（SAVE / SAVEM → ダウンロード）の流れ</text>

  <!-- 1 -->
  <rect x="70" y="50" width="620" height="58" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="100" cy="79" r="14" fill="#0969da"/>
  <text x="100" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="126" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328">BASIC で SAVE を実行</text>
  <text x="126" y="96" font-family="monospace" font-size="12" fill="#57606a">SAVE "DEMO" ／ SAVEM "M",&amp;H6000,&amp;H600F,&amp;H6000（3 引数必須）</text>
  <line x1="380" y1="108" x2="380" y2="132" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="70" y="134" width="620" height="58" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="100" cy="163" r="14" fill="#0969da"/>
  <text x="100" y="168" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="126" y="158" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328">書き込み内容が自動で録音される</text>
  <text x="126" y="180" font-family="sans-serif" font-size="12" fill="#57606a">CMT LED 点灯 → 完了で OK に戻る（rec の数が増える）</text>
  <line x1="380" y1="192" x2="380" y2="216" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="70" y="218" width="620" height="58" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="100" cy="247" r="14" fill="#0969da"/>
  <text x="100" y="252" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="126" y="242" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328">録音→.t77 ボタンを押す</text>
  <text x="126" y="264" font-family="sans-serif" font-size="12" fill="#57606a">Tape Image パネルの録音保存ボタン（録音が空だと淡色表示）</text>
  <line x1="380" y1="276" x2="380" y2="300" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="70" y="302" width="620" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="100" cy="331" r="14" fill="#1a7f37"/>
  <text x="100" y="336" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="126" y="326" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328">tape_&lt;日時&gt;.t77 がダウンロードされる</text>
  <text x="126" y="348" font-family="sans-serif" font-size="12" fill="#57606a">そのまま Tape Image にセットすれば LOAD で読み戻せる（往復可能）</text>

  <!-- note -->
  <rect x="70" y="386" width="620" height="48" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="86" y="415" font-family="sans-serif" font-size="13" fill="#bc4c00">ヒント: 新しい SAVE の前に 録音クリア を押すと、前の録音と混ざりません。</text>
</svg>
