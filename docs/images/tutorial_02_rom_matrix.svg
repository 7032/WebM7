<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <title>機種別に必要な ROM の積み上げ図。FM-7 の ROM に FM77AV 用、FM77AV40EX 用が積み増しになる</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">機種別に必要な ROM（上位機種ほど積み増し）</text>

  <!-- FM-7 基本セット -->
  <rect x="40" y="300" width="800" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="326" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">FM-7 基本セット（全機種で必要）</text>
  <text x="60" y="352" font-family="sans-serif" font-size="14" fill="#1f2328">必須: FBASIC30.ROM ／ SUBSYS_C.ROM</text>
  <text x="60" y="376" font-family="sans-serif" font-size="14" fill="#1f2328">必須（FM-7 系のみ）: BOOT_BAS.ROM（Boot Mode: BASIC） ／ BOOT_DOS.ROM（Boot Mode: DOS）</text>
  <text x="60" y="400" font-family="sans-serif" font-size="14" fill="#1f2328">任意: KANJI.ROM（FM-7 では漢字表示ソフト用。無くても起動可）</text>

  <!-- FM77AV 追加 -->
  <rect x="80" y="180" width="760" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="100" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a7f37">FM77AV / FM77AV40 追加分（この機種では必須）</text>
  <text x="100" y="232" font-family="sans-serif" font-size="14" fill="#1f2328">INITIATE.ROM ／ SUBSYS_A.ROM ／ SUBSYS_B.ROM ／ SUBSYSCG.ROM</text>
  <text x="100" y="256" font-family="sans-serif" font-size="14" fill="#1f2328">KANJI.ROM（FM77AV 以降は必須に変わります）。BOOT_BAS / BOOT_DOS は不要</text>

  <!-- FM77AV40EX 追加 -->
  <rect x="120" y="80" width="720" height="80" rx="8" fill="#ffebe9" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="140" y="106" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bc4c00">FM77AV40EX 追加分（この機種では必須）</text>
  <text x="140" y="134" font-family="sans-serif" font-size="14" fill="#1f2328">EXTSUB.ROM ／ DICROM.ROM ／ KANJI2.ROM</text>

  <!-- 積み増しの矢印 -->
  <line x1="60" y1="296" x2="60" y2="230" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="56" y="262" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="end" transform="rotate(-90 56 262)"></text>
  <line x1="100" y1="176" x2="100" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="48" y="266" font-family="sans-serif" font-size="12" fill="#57606a">＋追加</text>
  <text x="106" y="158" font-family="sans-serif" font-size="12" fill="#57606a">＋追加</text>

  <!-- 注記 -->
  <rect x="40" y="430" width="800" height="30" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="450" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">機種を切り替えると、ROM Files パネルに必要な行が自動で表示されます（必須／任意バッジ付き）</text>
</svg>
