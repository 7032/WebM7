<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <title>ROM 読み込みの手順図。フォルダ一括選択または個別指定で読み込み、OK 表示で成功</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <text x="440" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">ROM 読み込みの手順（ROM Files パネル）</text>

  <!-- スタート -->
  <rect x="290" y="52" width="300" height="44" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="440" y="79" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">ROM Files パネルを開く</text>

  <!-- 分岐矢印 -->
  <line x1="370" y1="96" x2="230" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="510" y1="96" x2="650" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 方法A -->
  <rect x="60" y="144" width="340" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="230" y="172" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da" text-anchor="middle">方法 A: Folder（一括選択）おすすめ</text>
  <text x="230" y="200" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">ROM が入ったフォルダを選ぶだけで</text>
  <text x="230" y="222" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">含まれるファイルをまとめて自動割り当て</text>

  <!-- 方法B -->
  <rect x="480" y="144" width="340" height="110" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="650" y="172" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8250df" text-anchor="middle">方法 B: 個別指定</text>
  <text x="650" y="200" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">FBASIC30.ROM など各行のファイル選択で</text>
  <text x="650" y="222" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">1 ファイルずつ選ぶ</text>

  <!-- 合流矢印 -->
  <line x1="230" y1="254" x2="370" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="650" y1="254" x2="510" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 結果 -->
  <rect x="220" y="302" width="440" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="440" y="328" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a7f37" text-anchor="middle">各 ROM の横が「OK」になれば読み込み成功</text>
  <text x="440" y="350" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">ROM はブラウザに保存され、次回から自動復元（Clear Saved で消去）</text>
</svg>
