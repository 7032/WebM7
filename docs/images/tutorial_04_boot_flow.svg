<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <title>起動までの流れ図。ROM 読み込み、機種選択、ブートモード選択、Power ON、OK プロンプト</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">起動までの流れ（Control パネル）</text>

  <!-- Step 1 -->
  <rect x="80" y="56" width="380" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="100" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">1. ROM を読み込む</text>
  <text x="100" y="101" font-family="sans-serif" font-size="13" fill="#1f2328">ROM Files パネルで必須 ROM が OK 表示</text>

  <line x1="270" y1="112" x2="270" y2="134" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 2 -->
  <rect x="80" y="138" width="380" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="100" y="162" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">2. Machine で機種を選ぶ</text>
  <text x="100" y="183" font-family="sans-serif" font-size="13" fill="#1f2328">FM-7 / FM77AV / FM77AV40 / FM77AV40EX</text>

  <line x1="270" y1="194" x2="270" y2="216" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 3 -->
  <rect x="80" y="220" width="380" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="100" y="244" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">3. Boot Mode を選ぶ</text>
  <text x="100" y="265" font-family="sans-serif" font-size="13" fill="#1f2328">Auto（おすすめ） / DOS / BASIC</text>

  <line x1="270" y1="276" x2="270" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 4 -->
  <rect x="80" y="302" width="380" height="56" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="100" y="326" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bc4c00">4. Power スイッチを ON へスライド</text>
  <text x="100" y="347" font-family="sans-serif" font-size="13" fill="#1f2328">Pause で一時停止 / Reset でリセット</text>

  <line x1="270" y1="358" x2="270" y2="380" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ゴール -->
  <rect x="80" y="384" width="380" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="100" y="410" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a7f37">起動成功！ OK プロンプトが表示される</text>
  <text x="100" y="432" font-family="sans-serif" font-size="13" fill="#1f2328">Screen をクリックしてからキー入力</text>

  <!-- 右側: BASIC 画面イメージ -->
  <rect x="510" y="120" width="320" height="230" rx="8" fill="#1f2328" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="530" y="156" font-family="monospace" font-size="15" fill="#7ee787">F-BASIC</text>
  <text x="530" y="184" font-family="monospace" font-size="15" fill="#7ee787">OK</text>
  <text x="530" y="212" font-family="monospace" font-size="15" fill="#7ee787">PRINT 123</text>
  <text x="530" y="240" font-family="monospace" font-size="15" fill="#7ee787"> 123</text>
  <text x="530" y="268" font-family="monospace" font-size="15" fill="#7ee787">OK</text>
  <rect x="530" y="284" width="12" height="18" fill="#7ee787"/>
  <text x="670" y="338" font-family="sans-serif" font-size="12" fill="#d0d7de" text-anchor="middle">画面イメージ（BASIC 起動後）</text>

  <line x1="464" y1="416" x2="560" y2="360" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 注記 -->
  <rect x="510" y="384" width="320" height="64" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="670" y="410" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">「先に ROM を読み込んでください」と</text>
  <text x="670" y="430" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">出たら手順 1 に戻ります</text>
</svg>
