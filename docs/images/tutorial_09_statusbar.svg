<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <title>画面下ステータスバーの各部説明図。1 段目はキーボード関連、2 段目はドライブと画面情報</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="440" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">画面下ステータスバーの見方（2 段構成）</text>

  <!-- 吹き出し（上段の説明） -->
  <rect x="40" y="56" width="190" height="58" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="135" y="79" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">ロック状態 LED</text>
  <text x="135" y="100" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">CAP / カナ / INS</text>

  <rect x="280" y="56" width="200" height="58" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="380" y="79" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">修飾キーの ON/OFF</text>
  <text x="380" y="100" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">SHIFT / CTRL / GRPH</text>

  <rect x="540" y="56" width="220" height="58" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="650" y="79" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">キーコード表示</text>
  <text x="650" y="100" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">入力キーのコード / スキャンコード</text>

  <line x1="135" y1="114" x2="135" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380" y1="114" x2="380" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="650" y1="114" x2="650" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ステータスバー本体 -->
  <rect x="60" y="156" width="760" height="100" rx="8" fill="#1f2328" stroke="#57606a" stroke-width="1.5"/>

  <!-- Row 1 -->
  <circle cx="100" cy="180" r="6" fill="#ff4d4d"/>
  <text x="114" y="185" font-family="sans-serif" font-size="13" fill="#d0d7de">CAP</text>
  <circle cx="166" cy="180" r="6" fill="#444c56"/>
  <text x="180" y="185" font-family="sans-serif" font-size="13" fill="#d0d7de">カナ</text>
  <circle cx="232" cy="180" r="6" fill="#444c56"/>
  <text x="246" y="185" font-family="sans-serif" font-size="13" fill="#d0d7de">INS</text>
  <line x1="296" y1="168" x2="296" y2="192" stroke="#444c56" stroke-width="1"/>
  <rect x="316" y="168" width="56" height="24" rx="6" fill="#2d333b" stroke="#768390"/>
  <text x="344" y="185" font-family="sans-serif" font-size="12" fill="#adbac7" text-anchor="middle">SHIFT</text>
  <rect x="380" y="168" width="52" height="24" rx="6" fill="#2d333b" stroke="#768390"/>
  <text x="406" y="185" font-family="sans-serif" font-size="12" fill="#adbac7" text-anchor="middle">CTRL</text>
  <rect x="440" y="168" width="56" height="24" rx="6" fill="#2d333b" stroke="#768390"/>
  <text x="468" y="185" font-family="sans-serif" font-size="12" fill="#adbac7" text-anchor="middle">GRPH</text>
  <line x1="520" y1="168" x2="520" y2="192" stroke="#444c56" stroke-width="1"/>
  <text x="544" y="185" font-family="monospace" font-size="13" fill="#7ee787">41/2C</text>
  <text x="620" y="185" font-family="sans-serif" font-size="13" fill="#8899aa">ASCII</text>

  <!-- Row 2 -->
  <circle cx="100" cy="226" r="6" fill="#444c56"/>
  <text x="114" y="231" font-family="sans-serif" font-size="13" fill="#d0d7de">Drv1</text>
  <circle cx="172" cy="226" r="6" fill="#ffcc33"/>
  <text x="186" y="231" font-family="sans-serif" font-size="13" fill="#d0d7de">Drv0</text>
  <text x="240" y="231" font-family="monospace" font-size="13" fill="#7ee787">T:00 S:01 READ</text>
  <line x1="420" y1="214" x2="420" y2="238" stroke="#444c56" stroke-width="1"/>
  <text x="444" y="231" font-family="monospace" font-size="13" fill="#7ee787">60.0fps</text>
  <text x="540" y="231" font-family="monospace" font-size="13" fill="#7ee787">640x200 8色</text>
  <rect x="700" y="212" width="64" height="28" rx="6" fill="#2d333b" stroke="#768390"/>
  <text x="732" y="231" font-family="sans-serif" font-size="13" fill="#adbac7" text-anchor="middle">FULL</text>

  <!-- 吹き出し（下段の説明） -->
  <line x1="140" y1="260" x2="140" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="300" y1="260" x2="300" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="260" x2="480" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="732" y1="260" x2="732" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="50" y="302" width="180" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="140" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">ドライブアクセス LED</text>
  <text x="140" y="346" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">Drive 1 / Drive 0</text>

  <rect x="244" y="302" width="160" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="324" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">ドライブ動作状態</text>
  <text x="324" y="346" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">トラック / セクタ / 状態</text>

  <rect x="418" y="302" width="220" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="528" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">フレームレートと画面モード</text>
  <text x="528" y="346" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">fps ／ 解像度・色数</text>

  <rect x="652" y="302" width="180" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="742" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">フルスクリーン切替</text>
  <text x="742" y="346" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">FULL ボタン / F11 キー</text>

  <!-- 注記 -->
  <rect x="60" y="382" width="760" height="32" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="403" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">LED の色は機種で変化します（FM-7 ＝赤 / FM77AV 系＝黄）。左端には音量スライダーもあります</text>
</svg>
